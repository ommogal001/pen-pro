<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pen Pro - Advanced Notes Manager</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="brand">
          <span class="brand-icon">✒</span>
          <div>
            <h1>Pen Pro</h1>
            <p>Advanced Notes</p>
          </div>
        </div>
        <button class="icon-btn mobile-close" id="closeSidebarBtn" type="button" aria-label="Close sidebar">✕</button>
      </div>

      <button class="btn btn-primary new-note-btn" id="newNoteBtn" type="button">+ New Note</button>

      <div class="search-box">
        <input type="search" id="searchInput" placeholder="Search notes..." autocomplete="off">
      </div>

      <div class="filter-row">
        <select id="categoryFilter" aria-label="Filter by category">
          <option value="all">All categories</option>
        </select>
        <select id="sortSelect" aria-label="Sort notes">
          <option value="updated-desc">Recently updated</option>
          <option value="updated-asc">Oldest updated</option>
          <option value="title-asc">Title A–Z</option>
          <option value="title-desc">Title Z–A</option>
        </select>
      </div>

      <ul class="note-list" id="noteList" role="list"></ul>

      <div class="sidebar-footer">
        <span id="noteCount">0 notes</span>
        <div class="sidebar-actions">
          <button class="icon-btn" id="exportBtn" type="button" title="Export backup">⬇</button>
          <button class="icon-btn" id="importBtn" type="button" title="Import backup">⬆</button>
          <input type="file" id="importFile" accept=".json" hidden>
          <button class="icon-btn" id="themeToggle" type="button" title="Toggle theme">☀</button>
        </div>
      </div>
    </aside>

    <main class="editor-panel">
      <header class="editor-header">
        <button class="icon-btn menu-btn" id="openSidebarBtn" type="button" aria-label="Open sidebar">☰</button>
        <div class="editor-meta" id="editorMeta">
          <span id="lastSaved">No note selected</span>
        </div>
        <div class="editor-actions">
          <button class="btn btn-ghost" id="previewToggle" type="button">Preview</button>
          <button class="btn btn-danger" id="deleteNoteBtn" type="button" disabled>Delete</button>
        </div>
      </header>

      <div class="editor-empty" id="editorEmpty">
        <div class="empty-icon">📝</div>
        <h2>Select or create a note</h2>
        <p>Your notes are saved automatically in this browser.</p>
        <button class="btn btn-primary" id="emptyNewNoteBtn" type="button">Create your first note</button>
      </div>

      <div class="editor-content hidden" id="editorContent">
        <input class="title-input" id="titleInput" type="text" placeholder="Note title" maxlength="120">

        <div class="toolbar">
          <select id="categorySelect" aria-label="Note category"></select>
          <div class="color-picker" id="colorPicker" role="group" aria-label="Note color"></div>
          <button class="btn btn-ghost pin-btn" id="pinBtn" type="button">📌 Pin</button>
        </div>

        <div class="editor-body">
          <textarea id="contentInput" placeholder="Write in Markdown... **bold**, *italic*, # heading, - list"></textarea>
          <div class="preview-pane hidden" id="previewPane"></div>
        </div>

        <footer class="editor-footer">
          <span id="wordCount">0 words · 0 characters</span>
          <span class="shortcut-hint">Ctrl+S save · Ctrl+N new note</span>
        </footer>
      </div>
    </main>
  </div>

  <div class="toast-container" id="toastContainer" aria-live="polite"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
